# Jellyfin Media Server Helm Values
# Official helm chart: https://jellyfin.github.io/jellyfin-helm

# Image configuration - use chart default (latest stable)
image:
  repository: docker.io/jellyfin/jellyfin
  pullPolicy: IfNotPresent
  # tag: ""  # Uses chart appVersion by default

# Use existing PVCs created outside helm chart
persistence:
  config:
    enabled: true
    existingClaim: "jellyfin-config"

  # Disable media PVC - we'll use volumes instead
  media:
    enabled: false

# Service configuration with Tailscale annotations
service:
  type: ClusterIP
  port: 80
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "jellyfin"

# Resource limits - raised CPU ceiling for software transcoding on worker nodes
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 3000m
    memory: 4Gi

# Schedule on any node with /mnt/external (NFS or local), preferring worker nodes
# to free the control-plane. Workers are labeled storage=external after NFS setup.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: storage
              operator: In
              values: ["external"]
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: DoesNotExist

# Use Recreate strategy instead of RollingUpdate
# Required because RWO PVCs can only attach to one pod at a time
deploymentStrategy:
  type: Recreate

# Environment variables
jellyfin:
  env:
    - name: TZ
      value: "America/Chicago"
    - name: JELLYFIN_PublishedServerUrl
      value: "http://jellyfin"

# Extra volumes for media - read-only hostPath
volumes:
  # Cache volume (for transcoding)
  - name: cache
    persistentVolumeClaim:
      claimName: jellyfin-cache
  # TV shows
  - name: tv
    hostPath:
      path: /mnt/external/tv
      type: DirectoryOrCreate
  # Movies
  - name: movies
    hostPath:
      path: /mnt/external/movies
      type: DirectoryOrCreate
  # Hardware acceleration (Intel QuickSync) - disabled; Jellyfin runs on worker nodes
  # which don't have /dev/dri. Re-enable if pinned back to optiplex-7040.
  # - name: dev-dri
  #   hostPath:
  #     path: /dev/dri
  #     type: Directory

# Extra volume mounts
volumeMounts:
  - name: cache
    mountPath: /cache
  - name: tv
    mountPath: /media/tv
    readOnly: true
  - name: movies
    mountPath: /media/movies
    readOnly: true
  # Intel QuickSync - disabled (see volumes section above)
  # - name: dev-dri
  #   mountPath: /dev/dri

# Security context - run as non-root
# supplementalGroups (video/render) and privileged removed: no longer needed
# since /dev/dri hardware acceleration is disabled for worker node scheduling.
podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch  # skip recursive chown if root dir already has correct ownership

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  readOnlyRootFilesystem: false

# Disable ingress (using Tailscale instead)
ingress:
  enabled: false

# Service account
serviceAccount:
  create: true
  automount: false
